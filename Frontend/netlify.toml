[[redirects]]
  from = "/app/*"
  to = "http://localhost:10000/app/:splat"
  status = 200
  force = true


[[redirects]]
  from = "/auth/*"
  to = "http://localhost:10000/auth/:splat"
  status = 200
  force = true


[[redirects]]
  from = "/sharing/*"
  to = "http://localhost:10000/sharing/:splat"
  status = 200
  force = true


[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

