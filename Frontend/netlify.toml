[[redirects]]
  from = "/app/*"
  to = "/app/:splat"
  status = 200
  force = true


[[redirects]]
  from = "/auth/*"
  to = "/auth/:splat"
  status = 200
  force = true


[[redirects]]
  from = "/sharing/*"
  to = "/sharing/:splat"
  status = 200
  force = true


[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

